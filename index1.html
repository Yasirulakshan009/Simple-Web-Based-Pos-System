<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Store - Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --apple-green: #00C42E; /* ඔයාගේ Primary Green Color එක */
            --apple-green-hover: #00b029;
            --bg-color: #f5f5f7; /* Apple Classic Light Background */
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- Login Container --- */
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        /* --- Apple Logo --- */
        .apple-logo {
            font-size: 56px;
            color: #1d1d1f;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p {
            color: #86868b;
            font-size: 17px;
            margin-bottom: 32px;
        }

        /* --- Input Fields --- */
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 17px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #1d1d1f;
            background: #ffffff;
        }

        input:focus {
            border-color: var(--apple-green);
            box-shadow: 0 0 0 4px rgba(0, 196, 46, 0.15);
        }

        input::placeholder {
            color: #86868b;
        }

        /* --- The Apple Style Green Button --- */
        .apple-btn {
            width: 100%;
            height: 52px;
            background: var(--apple-green);
            background: linear-gradient(180deg, #2ae152 0%, var(--apple-green) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 196, 46, 0.2);
        }

        .apple-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 196, 46, 0.3);
            filter: brightness(1.05);
        }

        .apple-btn:active {
            transform: translateY(0);
            filter: brightness(0.95);
        }

        /* --- Footer Link --- */
        .footer-link {
            margin-top: 24px;
            font-size: 14px;
            color: #06c;
            text-decoration: none;
            display: inline-block;
        }

        .footer-link:hover {
            text-decoration: underline;
        }

        /* --- Animations --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

<div class="login-card" id="loginCard">
    <div class="apple-logo"></div>

    <h1>Sign In</h1>
    <p>Manage your Apple Store account.</p>

    <div class="input-group">
        <input type="text" id="username" placeholder="Apple ID" autocomplete="off">
    </div>

    <div class="input-group">
        <input type="password" id="password" placeholder="Password">
    </div>

    <button class="apple-btn" onclick="validate()">Continue</button>

    <a href="#" class="footer-link">Forgot Apple ID or password?</a>
</div>

<script>
    function validate() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const card = document.getElementById('loginCard');

        // Username: y | Password: 1
        if(u === "y" && p === "1") {
            card.style.transition = "0.5s ease";
            card.style.opacity = "0";
            card.style.transform = "scale(0.95)";
            setTimeout(() => {
                alert("Welcome to Apple Store!");
            }, 500);
        } else {
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 400);
        }
    }
</script>
</body>
</html>
